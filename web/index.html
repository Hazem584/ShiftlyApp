<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Shiftly — shifts, attendance, reports and team conversations in one workspace.">
  <meta name="theme-color" content="#151326">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shiftly">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Shiftly | Your team workspace</title>
  <style>
    html, body { margin: 0; background: #f6f5f8; height: 100%; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center;
      font-family: system-ui, sans-serif; color: #151326; text-align: center; }
    #loading img { width: 76px; height: 76px; border-radius: 20px; }
    #loading h1 { margin: 18px 0 8px; font-size: 28px; letter-spacing: -.6px; }
    #loading p { color: #6b677b; font-size: 14px; }
    .progress { width: 140px; height: 4px; margin: 24px auto; border-radius: 4px;
      background: #e4e1eb; overflow: hidden; }
    .progress::after { content: ''; display: block; width: 45%; height: 100%;
      background: #f29446; border-radius: 4px; animation: slide 1.3s ease-in-out infinite alternate; }
    #retry { background: #151326; color: white; border: 0; padding: 12px 24px;
      border-radius: 12px; cursor: pointer; }
    @keyframes slide { to { transform: translateX(125%); } }
    @media (prefers-reduced-motion: reduce) { .progress::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-live="polite">
    <div><img src="icons/Icon-192.png" alt=""><h1>Shiftly</h1>
      <p id="loading-message">Getting your workspace ready…</p>
      <div class="progress" aria-hidden="true"></div>
      <button id="retry" hidden onclick="location.reload()">Try again</button>
    </div>
  </div>
  <noscript>Enable JavaScript to open Shiftly.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
