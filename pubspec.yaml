name: shiftly
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  cupertino_icons: ^1.0.8
  dio: ^5.9.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fluttertoast: ^10.0.0
  go_router: ^18.0.0
  geolocator: ^14.1.1
  image_picker: ^1.2.0
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  record: ^7.1.1
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.10.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_images.dart
