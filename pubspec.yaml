name: shiftly
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  chatview: 3.1.0
  crypto: ^3.0.7
  dio: ^5.9.0
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  fluttertoast: ^10.0.0
  go_router: ^18.0.0
  geolocator: ^14.1.1
  image_picker: ^1.2.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.5
  record: ^7.1.1
  shared_preferences: ^2.5.3
  sembast: ^3.8.11
  supabase_flutter: ^2.10.3
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  get_it: ^9.3.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# chatview 3.1.0 pins intl 0.20.2, while this Flutter SDK requires 0.20.3.
# The patch-level override keeps the requested package versions resolvable.
dependency_overrides:
  intl: 0.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/Logo.png
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Variable.ttf
