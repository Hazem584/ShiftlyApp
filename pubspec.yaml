name: shiftly
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
dependencies:
  cupertino_icons: ^1.0.8
  equatable: ^2.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_screenutil: ^5.9.3
  fluttertoast: ^10.0.0
  go_router: ^18.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
  - assets/images/

  fonts:
  - family: Cairo
    fonts:
    - asset: assets/fonts/Cairo-Regular.ttf
    - asset: assets/fonts/Cairo-Bold.ttf
      weight: 700
    - asset: assets/fonts/Cairo-Medium.ttf
      weight: 500
    - asset: assets/fonts/Cairo-Light.ttf
      weight: 300
    - asset: assets/fonts/Cairo-ExtraLight.ttf
      weight: 200
flutter_assets:
  assets_path: assets/
  output_path: lib/core/utils/
  filename: app_images.dart
